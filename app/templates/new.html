{% extends "base.html" %}
{% block title %}New Request — IT Service Requests{% endblock %}

{% block content %}
<h2 class="mb-4">Create New Service Request</h2>

<div class="card">
  <div class="card-body">
    <form method="post" action="/requests/new">

      <div class="mb-3">
        <label class="form-label">Requester <span class="text-danger">*</span></label>
        <select name="requester_id" class="form-select" required>
          <option value="">-- Select employee --</option>
          {% for u in users %}
            <option value="{{ u.id }}">{{ u.name }} ({{ u.email }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Subject <span class="text-danger">*</span></label>
        <input name="subject" class="form-control" maxlength="200" required
               placeholder="e.g. Laptop will not start">
      </div>

      <div class="mb-3">
        <label class="form-label">Description <span class="text-danger">*</span></label>
        <textarea name="description" class="form-control" rows="4" required
                  placeholder="Describe the issue in detail..."></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Category <span class="text-danger">*</span></label>
          <select name="category_id" class="form-select" required>
            <option value="">-- Select category --</option>
            {% for c in cats %}
              <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Priority <span class="text-danger">*</span></label>
          <select name="priority_id" class="form-select" required>
            <option value="">-- Select priority --</option>
            {% for p in prios %}
              <option value="{{ p.id }}">{{ p.name }} (SLA: {{ p.sla_hours }}h)</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Create Request</button>
        <a href="/" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
