<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IT Service Requests{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fa; }
    .badge-status { text-transform: uppercase; font-size: 0.75rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">🛠️ IT Service Requests</a>
      <div class="navbar-nav ms-auto align-items-center">
        <a class="nav-link" href="/dashboard">Dashboard</a>
        {% if user is defined and user.role == 'employee' %}
        <a class="nav-link" href="/requests/new">+ New Request</a>
        {% endif %}
        <a class="nav-link" href="/docs" target="_blank">API Docs</a>
        <a class="nav-link" href="/change-password">🔑 Password</a>
        <a class="nav-link text-warning" href="/logout">Logout</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
