<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IT Service Requests{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fa; }
    .card-sla-BREACHED { border-left: 5px solid #dc3545; }
    .card-sla-APPROACHING { border-left: 5px solid #ffc107; }
    .card-sla-WITHIN_SLA { border-left: 5px solid #198754; }
    .card-sla-RESOLVED_WITHIN_SLA { border-left: 5px solid #0d6efd; }
    .badge-status { text-transform: uppercase; font-size: 0.75rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">🛠️ IT Service Requests</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/requests/new">+ New Request</a>
        <a class="nav-link" href="/docs" target="_blank">API Docs</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
