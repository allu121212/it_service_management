{% extends "base.html" %}
{% block title %}Login — IT Service Requests{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-header bg-dark text-white text-center">
        <h4 class="mb-0">🔐 Sign In</h4>
      </div>
      <div class="card-body">
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required
                   placeholder="you@corp.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required
                   placeholder="Your password">
          </div>
          <button class="btn btn-primary w-100">Login</button>
        </form>

        <div class="alert alert-info mt-3 small mb-0">
          <strong>First time here?</strong> Your temporary password was sent to
          your corporate email. You will be asked to change it after logging in.
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
